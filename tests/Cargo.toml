[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
postgresql = ["toasty/postgresql"]
mysql = ["toasty/mysql"]

[dev-dependencies]
axum = "0.8.7"
http = "1.0"
http-body-util = "0.1"
hyper = "1.0"
serde_json = "1.0.145"
time = "0.3.44"
toasty = { version = "0.8.0", features = ["sqlite", "turso"] }
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-cookies = "0.11.0"
tower-sessions = "0.15.0"
tower-sessions-toasty-store = { path = "../toasty-store/" }

[[test]]
name = "test_integration"
path = "test-integration.rs"

[[test]]
name = "test_concurrency"
path = "test-concurrency.rs"
