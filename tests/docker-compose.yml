services:
  postgres_store:
    image: postgres
    environment:
      POSTGRES_PASSWORD: "postgres"
    ports:
      # 5433 on the host: 5432 is often taken by a locally running postgres
      - "5433:5432"

  mysql_store:
    image: mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=public
    ports:
      - "3306:3306"
